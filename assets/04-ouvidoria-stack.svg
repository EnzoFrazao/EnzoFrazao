<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 248" width="850" height="248" role="img" aria-labelledby="t4 d4">
  <title id="t4">MP/MA Ombudsman — workflow node census</title>
  <desc id="d4">A census of the n8n workflow, counted from the export rather than estimated: 88 functional nodes — 35 code, 21 httpRequest, 10 if, 9 switch, 7 redis, 2 webhook, plus 3 noOp and 1 respondToWebhook. All 35 code nodes are JavaScript, and every one of the 21 httpRequest nodes calls the WhatsApp Cloud API on Graph v19.0. Stack: n8n, WhatsApp Cloud API and Redis.</desc>

  <defs><clipPath id="frame4"><rect width="850" height="248" rx="14"/></clipPath></defs>
  <g clip-path="url(#frame4)"><rect width="850" height="248" fill="#0a0b10"/></g>
  <rect x=".5" y=".5" width="849" height="247" rx="14" fill="none" stroke="#1b2431"/>
  <g stroke="#243044" stroke-width="1" fill="none">
    <path d="M18 38V18h20"/><path d="M832 38V18h-20"/><path d="M18 210v20h20"/><path d="M832 210v20h-20"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="44" y="30" font-size="13" fill="#f59e0b" letter-spacing="2">MP/MA OMBUDSMAN · WORKFLOW</text>
    <text x="806" y="30" text-anchor="end" font-size="13" fill="#4a5768" letter-spacing="1.4">88 FUNCTIONAL NODES</text>
  </g>

  <!-- Counted from the export; the three JSONs on disk agree. The ghost bar underneath carries the
       true length with no animation, so the census survives even if SMIL never runs. 565px = 35. -->
  <g fill="#0f1119" stroke="#1a222e">
    <rect x="200" y="48" width="565" height="16" rx="4"/>
    <rect x="200" y="72" width="565" height="16" rx="4"/>
    <rect x="200" y="96" width="565" height="16" rx="4"/>
    <rect x="200" y="120" width="565" height="16" rx="4"/>
    <rect x="200" y="144" width="565" height="16" rx="4"/>
    <rect x="200" y="168" width="565" height="16" rx="4"/>
  </g>
  <g fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-opacity=".4">
    <rect x="200" y="48" width="565" height="16" rx="4"/>
    <rect x="200" y="72" width="339" height="16" rx="4"/>
    <rect x="200" y="96" width="161" height="16" rx="4"/>
    <rect x="200" y="120" width="145" height="16" rx="4"/>
    <rect x="200" y="144" width="113" height="16" rx="4"/>
    <rect x="200" y="168" width="32" height="16" rx="4"/>
  </g>
  <g fill="#f59e0b" fill-opacity=".22" stroke="none">
    <rect x="200" y="48" width="565" height="16" rx="4"><animate attributeName="width" values="0;0;565" keyTimes="0;0.00;1" dur="1.9s" fill="freeze"/></rect>
    <rect x="200" y="72" width="339" height="16" rx="4"><animate attributeName="width" values="0;0;339" keyTimes="0;0.08;1" dur="1.9s" fill="freeze"/></rect>
    <rect x="200" y="96" width="161" height="16" rx="4"><animate attributeName="width" values="0;0;161" keyTimes="0;0.16;1" dur="1.9s" fill="freeze"/></rect>
    <rect x="200" y="120" width="145" height="16" rx="4"><animate attributeName="width" values="0;0;145" keyTimes="0;0.24;1" dur="1.9s" fill="freeze"/></rect>
    <rect x="200" y="144" width="113" height="16" rx="4"><animate attributeName="width" values="0;0;113" keyTimes="0;0.32;1" dur="1.9s" fill="freeze"/></rect>
    <rect x="200" y="168" width="32" height="16" rx="4"><animate attributeName="width" values="0;0;32" keyTimes="0;0.40;1" dur="1.9s" fill="freeze"/></rect>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#e2e8f0">
    <text x="44" y="63">code</text>
    <text x="44" y="87">httpRequest</text>
    <text x="44" y="111">if</text>
    <text x="44" y="135">switch</text>
    <text x="44" y="159">redis</text>
    <text x="44" y="183">webhook</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#e2e8f0" text-anchor="end">
    <text x="806" y="63">35</text>
    <text x="806" y="87">21</text>
    <text x="806" y="111">10</text>
    <text x="806" y="135">9</text>
    <text x="806" y="159">7</text>
    <text x="806" y="183">2</text>
  </g>

  <!-- Inside their own bar, because that is where the evidence is: graph.facebook.com/v19.0
       occurs 21 times, one per httpRequest node. -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#f59e0b" fill-opacity=".9" text-anchor="end">
    <text x="755" y="60">JavaScript</text>
    <text x="533" y="84">Graph v19.0</text>
  </g>
  <text x="806" y="200" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#4a5768">+ 3 noOp · 1 respondToWebhook</text>
  <text x="44" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#e2e8f0">n8n · WhatsApp Cloud API · Redis</text>
</svg>
